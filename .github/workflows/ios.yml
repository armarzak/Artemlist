name: iOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Artemlist.xcodeproj -scheme Artemlist -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
