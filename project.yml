name: Artemlist
options:
  bundleIdPrefix: com.armarzak
  deploymentTarget:
    iOS: '17.0'
targets:
  Artemlist:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armarzak.Artemlist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
